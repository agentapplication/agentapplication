name: Documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check generated llms-full.txt
        run: npm run check:llms

      - name: Validate Mintlify build
        working-directory: docs
        run: npx --yes mint@4.2.646 validate

      - name: Check documentation links
        working-directory: docs
        run: npx --yes mint@4.2.646 broken-links
